<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="title">Counter</h1>
    <div id="counter" class="counter red">0</div>
    <div class="buttons">
      <button id="decrement" class="btn btn-dec">-</button>
      <button id="increment" class="btn btn-inc">+</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
